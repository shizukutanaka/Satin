# Satin CI ワークフロー定義
#
# ※ このファイルは setup/ 配下に置いています。GitHub App トークンには
#    `workflows` 権限が無く .github/workflows/ への push が拒否されるため、
#    ここに保管しています。CI を有効化するには、リポジトリ所有者が手動で
#    以下を実行してください:
#
#        mkdir -p .github/workflows
#        cp setup/github-actions-ci.yml .github/workflows/ci.yml
#        git add .github/workflows/ci.yml && git commit && git push
#
#    （有効化されるまで CI は一度も走りません。それまでの唯一の防波堤は
#     手元の `python check.py` です。）
#
# 設計方針: **このファイルは検証内容を持たない。** 何を検証するかは
# リポジトリ root の check.py が一箇所で定義し、CI はそれを呼ぶだけにする。
# 以前は yml 側にも pytest / ruff / mypy を個別に並べていたが、その形だと
# 「手元で通ったのに CI で落ちる」（およびその逆）が構造的に起こりうる。
# 手元と CI が文字通り同じコマンドを実行することで、その種の齟齬を消す。
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 espeak espeak-data

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r setup/requirements.txt

      # 検証ゲート本体。中身（py_compile / ruff / mypy / pytest /
      # config validate / 起動スモーク）は check.py が決める。
      # 手元で `python check.py` が緑なら、ここも緑になる。
      - name: Verification gate
        run: python check.py
