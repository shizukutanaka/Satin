# Satin CI ワークフロー定義
#
# ※ このファイルは setup/ 配下に置いています。GitHub App トークンには
#    `workflows` 権限が無く .github/workflows/ への push が拒否されるため、
#    ここに保管しています。CI を有効化するには、リポジトリ所有者が手動で
#    以下を実行してください:
#
#        mkdir -p .github/workflows
#        cp setup/github-actions-ci.yml .github/workflows/ci.yml
#        git add .github/workflows/ci.yml && git commit && git push
#
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    # 静的解析ゲート: ruff.toml の enforced set（correctness 系ルール）。
    # これにより F821 未定義名（OpenGL 未 import の 3D 描画クラッシュ・
    # cloud_backup の List 未 import 等）、B006 ミュータブルデフォルト、
    # B904 例外チェーン欠落といったバグ類型の回帰を自動検出する。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff lint (enforced correctness rules from ruff.toml)
        run: ruff check main/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 espeak espeak-data

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r setup/requirements.txt

      - name: Syntax check all main modules
        run: |
          python -m py_compile $(find main -name "*.py" | sort)

      - name: Lint (ruff)
        run: |
          python -m ruff check main/ tests/ satin_launcher.py

      # 対象は mypy.ini が決める（未クリーンなモジュールはそこで免除リスト入り）。
      # 引数を渡さないことで、リストの更新漏れによる検査漏れが起きないようにする。
      - name: Type check (mypy)
        run: |
          python -m mypy

      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short
        env:
          PYTHONPATH: main
