# mypy 設定 — 静的型検査の段階導入（ワークオーダー W-07）
#
# 方針: **新しく書くコードは既定で型検査対象**にし、まだ通らない既存モジュールだけを
# 末尾に列挙して免除する（グランドファザリング）。列挙する側を「これから直すもの」に
# しておくと、リストは時間とともに**縮む**方向にしか動かない。逆に「検査するもの」を
# 列挙する設計だと、新規モジュールは黙って検査対象外になり、リストを更新し忘れた
# ぶんだけ穴が広がる — `tests/test_i18n.py` の _DASHBOARD_KEYS が実際にそうやって
# 陳腐化した（32 件のハードコードに対し実使用 37 件）。同じ轍は踏まない。
#
# 現状: main/ の**全モジュールが検査対象**。免除リストは空になった
# （導入時は 52 モジュール中 42 が免除。そこから 3 段階で削り切った）。
# 新しく免除ブロックを足す前に、まず直せないか考えること — このファイルに
# セクションが 1 つも無い状態が正常であり、増えたら退行である。
#
# 実行: リポジトリルートで `python -m mypy`（引数不要。files= が対象を決める）
#
# 背景: ruff は F821（NameError 級）を捕まえてくれるが、型の不整合は実行時まで
# 表に出ない。実際この導入で「フォールバック実装の引数名が本物とずれていて、
# キーワード呼び出しがフォールバック時だけ TypeError になる」既存バグが 2 件
# 見つかっている（user_wellbeing / usage_guardrails の _find_archives）。
#
# 素の指摘を見たいとき（免除を足す判断をする前に必ず）:
#   python -m mypy --config-file=/dev/null --ignore-missing-imports \
#       --follow-imports=silent main/<module>.py

[mypy]
files = main
mypy_path = main
# 任意依存（PyQt5・OpenGL・pygltflib・flask・cv2 …）は未導入環境でも検査を
# 通したいので、スタブ不在をエラーにしない。
ignore_missing_imports = True
# 段階導入の要: 注釈の無い関数の**中身**までは検査しない。注釈済みの箇所だけを
# 厳格に見て、未注釈コードは「まだ書かれていない契約」として素通りさせる。
check_untyped_defs = False
disallow_untyped_defs = False
# 到達不能コード・冗長なキャストは設定ミスの兆候なので拾う。
warn_unreachable = False
warn_redundant_casts = True
warn_no_return = True
# 出力を読みやすく（どのコードを無視すればよいかが分かる）。
show_error_codes = True
pretty = False
